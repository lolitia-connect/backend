name: Performance

on:
  pull_request:
    # Fork-specific: the fork's integration branch is "develop", not upstream's
    # "dev"/"master"; "main" is kept because pull requests against it still run.
    branches: ["develop", "main"]
    paths:
      # Fork-specific: the Hertz compatibility layer lives in pkg/hertzx (upstream
      # names it pkg/httpx).
      - "internal/**"
      - "pkg/hertzx/**"
      - "scripts/perf/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
    inputs:
      bench_time:
        description: "Go benchmark benchtime, for example 1s, 3s, or 10s"
        required: false
        default: "3s"
      bench_count:
        description: "Number of benchmark repetitions"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  http-server-benchmark:
    name: HTTP server benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run benchmarks
        env:
          BENCH_TIME: ${{ github.event.inputs.bench_time }}
          BENCH_COUNT: ${{ github.event.inputs.bench_count }}
        run: |
          bash scripts/perf/bench.sh | tee benchmark.txt
          {
            echo "### HTTP server benchmarks"
            echo
            echo '```'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-server-benchmark
          path: benchmark.txt
