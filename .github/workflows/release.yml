name: Build and Release
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

# Read-only by default; the jobs that create the release and upload its assets
# ask for contents: write themselves.
permissions:
  contents: read

env:
  # Pinned tool versions. Upstream reads these from the Makefile
  # (`make -s print-GORELEASER_VERSION`); this fork's Makefile has no tool-version
  # variables or print-% target, so the pin lives here instead. Keep the two in
  # step if the Makefile gains them.
  GORELEASER_VERSION: v2.18.2

jobs:
  # Fork-specific: builds the server on every branch push as well as on tags, so
  # a broken master is visible without tagging. Upstream triggers on tags only.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Read from go.mod rather than a literal: the module requires go 1.27.4
          # and a hardcoded older toolchain fails the build.
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o ppanel-server ./ppanel.go

  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Resolved once so the binaries and the release metadata agree.
      - name: Resolve release metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *beta* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        run: go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"

      - name: Run GoReleaser
        env:
          # Fork-specific secret name.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          goreleaser check
          goreleaser release --clean

  releases-matrix:
    name: Release ppanel-server binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release-notes  # wait for release-notes job to finish
    permissions:
      contents: write
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64,
        # windows/386, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ '386', amd64, arm64 ]
        exclude:
          - goarch: '386'
            goos: darwin
    env:
      VERSION: ${{ needs.release-notes.outputs.version }}
      CHANNEL: ${{ needs.release-notes.outputs.channel }}
      BUILD_TIME: ${{ needs.release-notes.outputs.build_time }}
      ASSET: ppanel-server-${{ matrix.goos }}-${{ matrix.goarch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile target is named after the platform and writes
      # bin/ppanel-server-<goos>-<goarch>[.exe] with CGO_ENABLED=0 and -trimpath,
      # so the release binaries are static. Every target this matrix needs exists
      # in the fork's Makefile (linux-386/amd64/arm64, windows-386/amd64/arm64,
      # darwin-amd64/arm64).
      #
      # Divergence from upstream: this Makefile reads VERSION only, and derives
      # the build time itself; it has no CHANNEL or BUILD_TIME variable and
      # pkg/constant has no Channel field. CHANNEL is still exported above for
      # the release channel of the tag and is passed on so the call matches
      # upstream, but it has no effect until the Makefile grows the variable.
      - name: Build
        run: make "${{ matrix.goos }}-${{ matrix.goarch }}" VERSION="$VERSION"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p "dist/$ASSET"
          cp LICENSE "dist/$ASSET/"
          # Upstream also ships etc/ppanel.yaml in the archive. This fork does
          # not track an etc/ directory (the image creates /app/config.yaml at
          # build time), so there is nothing to copy here.
          if [ "${{ matrix.goos }}" = windows ]; then
            cp "bin/$ASSET.exe" "dist/$ASSET/ppanel-server.exe"
            archive="$ASSET.zip"
            (cd dist && zip -qr "$archive" "$ASSET")
          else
            install -m 0755 "bin/$ASSET" "dist/$ASSET/ppanel-server"
            archive="$ASSET.tar.gz"
            (cd dist && tar -czf "$archive" "$ASSET")
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256" && cat "$archive.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "PPanel Server $VERSION" --notes "Release $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
