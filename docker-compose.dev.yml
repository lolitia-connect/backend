services:
  ppanel:
    container_name: ppanel-dev-server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    command: ["run", "--config", "config.dev.yaml"]
    volumes:
      - ./config.dev.yaml:/app/config.dev.yaml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: ppanel-dev-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ppanel
      POSTGRES_USER: ppanel
      POSTGRES_PASSWORD: ppanel_test_password
    ports:
      - "5432:5432"
    volumes:
      - ppanel-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppanel -d ppanel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: ppanel-dev-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ppanel-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ppanel-dev-postgres:
  ppanel-dev-redis: