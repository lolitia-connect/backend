name: Build Linux Binary

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty for auto)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod (1.27.4): the previous literal 1.25.0 cannot build
          # this module.
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      # Fork-specific: this job keeps publishing a single linux/amd64 tarball
      # and checksum for the branch pushes and manual dispatches that
      # release.yml does not cover. It now builds through the same Makefile
      # target as the release so the flags (CGO_ENABLED=0, -trimpath, the
      # pkg/constant version stamp) are identical, instead of a second inline
      # `go build` with its own ldflags. The asset name is unchanged.
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --always --dirty)
          fi
          # Strip the leading "v" the Makefile's own default would also strip,
          # so `ppanel-server version` reports the same string as release.yml.
          VERSION="${VERSION#v}"

          echo "Building ppanel-server $VERSION"
          make linux-amd64 VERSION="$VERSION"
          cp bin/ppanel-server-linux-amd64 ppanel-server
          tar -czf ppanel-server-${VERSION}-linux-amd64.tar.gz ppanel-server
          sha256sum ppanel-server ppanel-server-${VERSION}-linux-amd64.tar.gz > checksum.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppanel-server-linux-amd64
          path: |
            ppanel-server
            ppanel-server-*-linux-amd64.tar.gz
            checksum.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Check if release exists
          if gh release view $VERSION >/dev/null 2>&1; then
            echo "Release $VERSION already exists, deleting old assets..."
            # Delete existing assets if they exist
            gh release delete-asset $VERSION ppanel-server-${VERSION}-linux-amd64.tar.gz --yes 2>/dev/null || true
            gh release delete-asset $VERSION checksum.txt --yes 2>/dev/null || true
          else
            echo "Creating new release $VERSION..."
            gh release create $VERSION --title "PPanel Server $VERSION" --notes "Release $VERSION"
          fi

          # Upload assets (will overwrite if --clobber is supported, otherwise will fail gracefully)
          echo "Uploading assets..."
          gh release upload $VERSION ppanel-server-${VERSION}-linux-amd64.tar.gz checksum.txt --clobber
